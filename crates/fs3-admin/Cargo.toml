[package]
name = "fs3-admin"
description = "FastS3 管理 API:unix socket/TCP + Bearer token,status/buckets/keys/uploads/metrics/audit/repair"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs3-core.workspace = true
fs3-engine.workspace = true
fs3-s3.workspace = true
fs3-meta.workspace = true
# M15 N3:通知投递指标渲染用(NotificationStats;fs3-http 不反向依赖
# fs3-admin,无环)。
fs3-http.workspace = true
hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex.workspace = true
tokio-tungstenite = { version = "0.26", features = ["handshake"] }
futures-util = "0.3"
tracing.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true
fs3-device.workspace = true
# A3 集成测试:注入真 KmsServiceManager(vault 车道)
fs3-kms.workspace = true
