[package]
name = "fs3-meta"
description = "FastS3 元数据:rocksdb 封装、键编码/转义、事务与组提交"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs3-core.workspace = true
# backstore:rust-rocksdb(ADR-8)。default-features=false 剔除压缩库
# (值已 postcard 编码,压缩收益有限;依赖最小化);bindgen-runtime 使
# librocksdb-sys 构建期经 LIBCLANG_PATH 动态加载 libclang。
rocksdb = { workspace = true, default-features = false, features = ["bindgen-runtime"] }
serde.workspace = true
postcard.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# M13 N2-1 BlueFS spike:直接使用 rust-rocksdb Env API(挂载点验证)
rocksdb = { workspace = true }
