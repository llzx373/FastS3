[package]
name = "fs3d"
description = "FastS3 数据面入口(M0:CLI 形态的引擎 PoC)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fasts3d"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
# 测试夹具:v2 存量值编码(V5-3 rewrite 混合库测试;复用 workspace 既有依赖)
postcard.workspace = true
# M21 B1:复制口 mTLS 测试自签 CA/证书(锁树已有 rcgen 0.13,零新增包)
rcgen.workspace = true

[dependencies]
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
fs3-core.workspace = true
parking_lot.workspace = true
fs3-device.workspace = true
fs3-alloc.workspace = true
fs3-meta.workspace = true
fs3-engine.workspace = true
fs3-s3.workspace = true
fs3-http.workspace = true
fs3-admin.workspace = true
# M21 B1(ADR-33 RP6):复制口服务端(repl.rs)——rustls 服务端 mTLS 强制 +
# 手写 HTTP/1.1,独立线程 current_thread runtime(照 fs3-admin 先例,
# 数据面热路径零 tokio)。全部已在锁树(fs3-agent/fs3-http/fs3-admin
# 同版本),零新增包。
# M21 B4(repl_worker.rs):下游 pull worker 复用同栈;hyper 加 client
# feature(同 crate 同版本,特性并集,零新增包)。
# M21 C3(repl_backfill.rs):回填池——tokio 加 sync(Semaphore/mpsc,
# 同特性并集口径,零新增包;并发 = spawn_local 网络交错,引擎写锁
# 本就串行落盘,不取 rt-multi-thread)。
tokio = { version = "1.40", features = ["rt", "sync", "net", "io-util", "time", "macros"] }
hyper = { version = "1.5", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
# M20(ADR-29):SSE-KMS 密钥托管——fs3-kms 客户端 + 托管管理器
fs3-kms.workspace = true
# M14 G1-1(ADR-17 DV1):纳管 agent 可选模块;feature 默认关,
# 关闭时本 crate 不参与编译(默认二进制与 v1.x 行为/性能零差异,门禁)
fs3-agent = { workspace = true, optional = true }
clap.workspace = true
toml.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
# M5 `bench-md5`:与 SIMD 多缓冲 MD5 对比的单缓冲基线(仅基准用)
md-5.workspace = true

[features]
# M14 G1-1(ADR-17 DV1):纳管 agent;默认关(Cargo 无 default = 全关)。
# 关闭 = fs3-agent 不编译,二进制与 v1.x 零差异(门禁)。
agent = ["dep:fs3-agent"]
# M14 H1-1(ADR-17 DV2):HTTP/3 实验(quinn);默认关。评估期 6 个月,
# 无企业弱网诉求则冻结;默认构建零新增依赖(门禁内存 ≤256MiB 不回归)。
http3 = ["fs3-http/http3"]
