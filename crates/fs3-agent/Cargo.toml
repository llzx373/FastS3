[package]
name = "fs3-agent"
description = "FastS3 M14 纳管 agent:出站 mTLS 连接中心,心跳/指标/审计流式上报,下发接收与本地裁决执行(默认关,feature-gate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs3-core.workspace = true
hyper = { version = "1.5", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing.workspace = true
# 出站 mTLS(ADR-17 DV1:agent 主动出站双向 TLS;红线 §9.4 #3)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
base64.workspace = true

[dev-dependencies]
# 单测/集成测试自签 CA + 节点证书 + 模拟中心 TLS 服务器
rcgen.workspace = true
tempfile.workspace = true
hex.workspace = true
toml.workspace = true
hyper-util = { version = "0.1", features = ["server-auto"] }