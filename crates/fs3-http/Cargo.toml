[package]
name = "fs3-http"
description = "FastS3 HTTP 接入:hyper + SO_REUSEPORT、流式请求/响应"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dev-dependencies]
fs3-core.workspace = true
parking_lot.workspace = true
fs3-device.workspace = true
fs3-engine.workspace = true
fs3-s3.workspace = true
serde_json.workspace = true
md-5.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
# h2c prior-knowledge 客户端(REVIEW §2.2 集成测试):http2 + client conn
hyper = { version = "1.5", features = ["http1", "http2", "client", "server"] }
# H1-1 测试资产:quinn/h3 客户端作真实 HTTP/3 对端
quinn = { version = "0.11", features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

[dependencies]
fs3-core.workspace = true
fs3-s3.workspace = true
# M15 N3:通知投递 worker 直读 MetaStore(e: 队列/n: 规则;仅后台 worker
# 短事务,不进数据热路径;依赖方向 fs3-http → fs3-meta 合规——fs3-http
# 已在 fs3-s3 之下消费 fs3-engine,fs3-meta 是其被依赖方)。
fs3-meta.workspace = true
serde_json.workspace = true
rcgen.workspace = true
fs3-engine.workspace = true
hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
http-body = "1"
http = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-stream = "0.1"
bytes = "1"
libc.workspace = true
tracing.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
tokio-rustls = "0.26"
# M14 H1-1(ADR-17 DV2):HTTP/3 实验栈(feature 默认关;quinn 传输 +
# hyperium h3 协议层;不进入默认构建,零常驻开销)。依赖审批见
# DESIGN-FUTURE §9.3(quinn 行)+ ADR-17 DV2(6 个月评估期)。
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
socket2 = { version = "0.5", optional = true, features = ["all"] }

[features]
# 实验 HTTP/3(每核 QUIC Endpoint;0-RTT 仅幂等 GET/HEAD;默认关)
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:socket2"]
