# FastS3 用户文档

# 构建: pip install mkdocs && mkdocs serve -f docs/site/mkdocs.yml
# 公开托管后填写 site_url / repo_url（GitHub Pages 或任意静态站）。

site_name: FastS3
site_description: Linux 单机高性能 S3 服务 — 安装、部署、运维与协议参考
copyright: Licensed under the Apache License, Version 2.0.

theme:
  name: readthedocs

nav:
  - 首页: index.md
  - 快速开始:
      - 内网一天跑起来: getting-started/quickstart.md
  - 部署:
      - systemd: deployment/systemd.md
      - 容器: deployment/container.md
  - 运维:
      - 管理员指南: operations/admin-guide.md
      - IAM 多租户运维: operations/iam.md
      - 主备复制: operations/replication.md
      - 中心纳管: operations/center.md
      - 升级与回滚: operations/upgrade.md
      - 备份/恢复: operations/backup-restore.md
      - 审计导出(代替 Logging): operations/audit-export.md
      - 退出路径: operations/exit.md
      - 迁移(MinIO/公有云): operations/migration.md
      - 性能调优: operations/tuning.md
      - 故障排查与 FAQ: operations/troubleshooting.md
      - 安全基线与 CVE 响应: operations/security.md
  - 参考:
      - fasts3d 命令速查: reference/cli.md
      - admin API 参考: reference/admin-api.md
      - Node 管理 API 参考: reference/web-api.md
      - 错误码速查: reference/errors.md
      - 兼容性矩阵: reference/compat.md
  - 社区:
      - 如何贡献: community/contributing.md
      - 安全披露: community/security.md
  - 发布:
      - v1.0.0 GA 公告(历史): release/v1.0.0.md
  - Beta:
      - Beta 计划与反馈: beta/index.md
      - Beta 评审清单: beta/review.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - fenced_code
