name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每夜构建轨道(ROADMAP §3.1:nightly 不承诺)
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-stable:
    name: Rust (stable) fmt/clippy/test/audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: release build
        run: cargo build --release -p fs3d

      - name: cargo audit (依赖漏洞清零门禁)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust-nightly:
    name: Rust (nightly) build+test
    runs-on: ubuntu-latest
    continue-on-error: true # nightly 轨道不承诺
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release

  # M4 门禁:B2 老内核兜底(prea/pwrite,io_uring 关闭 = 4.x 内核功能路径)
  # 在 CI 上以 --no-uring 全链路(含崩溃/断电收敛)验证;真 4.x 内核矩阵
  # 由裸机 runner 扩展(见 docs/m4-powerloss.md)。
  m4-crash-fallback:
    name: M4 crash harness (pread/pwrite fallback)
    runs-on: ubuntu-22.04 # 内核 5.15;复用兜底路径
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release build
        run: cargo build --release -p fs3d
      - name: crash harness (no-uring, 60 rounds)
        run: tests/crash/run_crash_m4.sh 60 --full --no-uring
      - name: power-loss sim (no-uring, 20 rounds)
        run: tests/crash/powerloss_sim.sh 20
      # M13 M5-1 门禁:双盘/三盘崩溃 500 轮(CI 冒烟 60 轮;发布前整跑
      # 500 轮见 TODO M13 门禁)+ 缺盘/扩容/再平衡演练
      - name: multi-device crash harness (2 devices, 60 rounds)
        run: tests/crash/run_crash_multi.sh 60 --devices 2 --no-uring
      - name: multi-device crash harness (3 devices, 60 rounds)
        run: tests/crash/run_crash_multi.sh 60 --devices 3 --no-uring
      - name: M13 drills (degraded / add-remove / rebalance convergence)
        run: tests/crash/m13_drills.sh --skip-p99
      - name: doctor smoke (uninitialized device → fatal, exit 1)
        run: |
          truncate -s 64M /tmp/ci-doctor.img
          printf '[storage]\ndevices = ["/tmp/ci-doctor.img"]\nmeta_dir = "/tmp/ci-doctor-meta"\n' > /tmp/ci-doctor.toml
          ./target/release/fasts3d doctor --config /tmp/ci-doctor.toml
        continue-on-error: true # 未初始化设备预期 fatal(exit 1);仅验证命令可运行

  pnpm-workspace:
    name: pnpm workspace (lockfile frozen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: workspace list
        run: pnpm -r list --depth -1

  # 性能门禁(M5 起接入 CI):需要专用 NVMe runner,当前为占位
  # bench:
  #   runs-on: [self-hosted, nvme]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: tests/fio/baseline.sh /dev/nvme0n1
  #     - run: target/release/fasts3d bench ...
