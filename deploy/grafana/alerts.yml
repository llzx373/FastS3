# FastS3 Prometheus 告警规则(M5 L4 部分)。
#
# 部署:
#   - Prometheus 抓取 FastS3 admin `/v1/admin/metrics`(见 prometheus.yml 示例);
#   - 把本文件挂到 Prometheus rule_files,`promtool check rules` 校验:
#       promtool check rules deploy/grafana/alerts.yml
#   - 阈值按部署规模调整;email/webhook/alertmanager 集成由 operator 配置。

groups:
  - name: fasts3
    rules:
      # 数据面可用性:5xx 速率激增
      - alert: FastS3High5xxRate
        expr: |
          sum(rate(fasts3_requests_total{class="5xx"}[5m]))
          /
          clamp_min(sum(rate(fasts3_requests_total[5m])), 1)
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "FastS3 5xx 占比 > 5%@5m"
          description: "最近 5 分钟 5xx 请求占比 >> 5%;检查设备降级、超载或配置错误"

      # 错误码激增(NoSuchKey 之外的 server 错误)
      - alert: FastS3ServerErrorsSpike
        expr: |
          sum(rate(fasts3_errors_total[5m])) > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "FastS3 错误码速率 > 50/s@5m"
          description: "错误码(含客户端 4xx)速率异常,查看 fasts3_errors_total 明细"

      # 延迟劣化:p99 > 200ms(小对象命中路径的目标 <1ms;阈值给足余量)
      - alert: FastS3HighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(fasts3_latency_seconds_bucket[5m])) by (le)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FastS3 p99 延迟 > 200ms"
          description: "全 op p99 延迟超过 200ms 持续 5 分钟;检查设备降级/过载"

      # 时钟回拨(预签名对时钟敏感;回拨会破坏 SigV4/预签名)
      - alert: FastS3ClockJump
        expr: |
          increase(fasts3_clock_jumps_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "检测到 wall-clock 回拨"
          description: "NTP 校时引发时钟回拨将导致预签名/签名窗口失效;立即核查 ntpd/chronyd"

      # M12 W1-2:Object Lock 可信时钟与墙钟偏离(回拨取单调下界,保留不缩短)
      - alert: FastS3TrustedClockDivergence
        expr: |
          fasts3_trusted_clock_divergence_seconds > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "可信时钟与墙钟偏离(Object Lock)"
          description: "墙钟落后于持久化单调高水位;Object Lock 到期判定使用 trusted_now,保留不会因回拨提前解除。立即核查 NTP/chrony,勿在停机期手动拨时钟"

      # 单盘水位 >85%(M13 M4-2:统一视图逐盘;快照粒度 = 活字节/容量,
      # 与 DESIGN §6.1「水位 = data_end − live_bytes」口径一致)。
      # 持续 15 分钟超限即告警(写入突发会短暂冲高);再平衡 worker 开启
      # 后新盘倾斜会自动缓解,告警应收敛。
      - alert: FastS3DeviceWatermarkHigh
        expr: |
          fasts3_device_usage{device!=""} > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "单盘水位 >85%"
          description: "{{ $labels.device }} 水位超过 85%(活字节/容量);若长期高水位,考虑 device-add 扩容或开启 rebalance.enabled=true"

      # 设备已降级(掉盘 → 只读)
      # REVIEW §3.7:指标源已接入(/v1/admin/metrics 输出 fasts3_device_degraded,
      # 由引擎 degraded 状态驱动);持续 5 分钟降级即告警,避免瞬时抖动误报。
      - alert: FastS3DeviceDegraded
        expr: |
          fasts3_device_degraded == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "设备已降级(掉盘 → 只读)"
          description: "fasts3_device_degraded=1:存储设备 I/O 失败,引擎进入只读降级;立即核查磁盘/线缆/NVMe 健康,恢复后自动解除"

      # io_uring 队列频繁打满(在途=深度,说明配额/背压触顶)
      - alert: FastS3IoRingSaturated
        expr: |
          fasts3_io_uring_inflight > 1000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "io_uring 在途接近 ring 深度上限"
          description: "ring depth 默认 1024;持续打满说明背压/限速在工作(见 503 SlowDown 与 admission 指标)"

      # 生命周期执行器停滞(M11 L3-2):超过 2 个周期未跑完一轮。
      # 阈值 = 2 × lifecycle_interval_secs(默认 86400 ⇒ 172800s;配置过
      # 小周期时按部署调整)。指标缺席 = worker 未启用(lifecycle_enabled
      # = false / 只读引擎),不告警;> 0 条件排除启动后首轮未跑的窗口。
      - alert: FastS3LifecycleStalled
        expr: |
          (time() - fasts3_lifecycle_last_cycle_timestamp > 172800)
          and (fasts3_lifecycle_last_cycle_timestamp > 0)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "生命周期执行器超过 2 个周期未运行"
          description: "fasts3_lifecycle_last_cycle_timestamp 停滞;检查 fs3-lifecycle worker 线程日志(规则桶过期删除/会话中止暂停中)"

      # 生命周期删除突增(信息级):规则误配(如 prefix 过宽)的第一信号
      - alert: FastS3LifecycleDeletedSpike
        expr: |
          increase(fasts3_lifecycle_deleted_objects_total[1h]) > 10000
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "生命周期 1h 删除对象数突增(>10000)"
          description: "信息级:核对近期生命周期规则变更是否符合预期;阈值按部署规模调整"
