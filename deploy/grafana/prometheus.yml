# Prometheus 抓取示例(M5 L4):FastS3 admin 指标端点。
# 用法:prometheus --config.file=deploy/grafana/prometheus.yml
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: fasts3
    # FastS3 admin API `/v1/admin/metrics` 输出 Prometheus 文本(默认 unix socket;
    # 要远程抓取请配置 [admin] listen = "127.0.0.1:9001" + token,并经反向代理鉴权)。
    # 此处仅示例直连端点;生产推荐经 scrape 侧代理注入 Bearer token。
    metrics_path: /v1/admin/metrics
    scheme: http
    static_configs:
      - targets: ["127.0.0.1:9001"]
    basic_auth:
      username: fasts3
      password: "<admin token 或代理注入>"
