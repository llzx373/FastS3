# FastS3 POC 默认编排(M17/T2)。
# 单服务、端口 9000(S3)+ 8080(控制台),数据卷 ./data。
# 一条命令(仓库根):
#   docker compose -f deploy/container/docker-compose.yml up -d --build
# 生产拆分见 docker-compose.prod.yml;第二 web 实例示例见本目录 README。
#
# 镜像标签与 Cargo.toml workspace.package.version 对齐(现 2.2.1)。

services:
  fasts3:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
    image: fasts3:2.2.1
    ports:
      - "9000:9000"
      - "8080:8080"
    volumes:
      - ./data:/var/lib/fasts3
    environment:
      FASTS3_CONFIG: /etc/fasts3/fasts3.toml
      FASTS3_INIT_SIZE: ${FASTS3_INIT_SIZE:-20GiB}
      # 单容器内 Node 连本机数据面(unix admin + 回环 S3)
      FS3_WEB_LISTEN: 0.0.0.0:8080
      FS3_WEB_STATIC: /opt/fasts3/web/console/dist
      FS3_WEB_JWT_SECRET: change-me-jwt-secret
      FS3_WEB_USER: admin
      FS3_WEB_PASSWORD: admin123
      FS3_ADMIN_LISTEN: unix:///run/fasts3/admin.sock
      FS3_ADMIN_TOKEN: change-me
      FS3_S3_ENDPOINT: http://127.0.0.1:9000
      FS3_S3_ACCESS_KEY: fasts3dev
      FS3_S3_SECRET_KEY: fasts3dev
    # io_uring 注册缓冲需要 mlock;受限环境放开:
    # ulimits: { memlock: { soft: -1, hard: -1 } }
    # 全功能 io_uring(SQPOLL)/裸设备需要特权(二选一,按需取消注释):
    # cap_add: [SYS_ADMIN, IPC_LOCK]
    # privileged: true   # 最宽松形态(不推荐,仅兜底)
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || (command -v nc >/dev/null 2>&1 && nc -z 127.0.0.1 9000)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
