# FastS3 配置示例(DESIGN §10.1;字段与 crates/fs3d/src/config.rs 一一对应,
# 未知字段 serde 静默忽略——不要依赖死字段,REVIEW §4.3 清理)。

[storage]
devices = ["/var/lib/fasts3/disk.img"]   # 或 ["/dev/nvme0n1"] 裸设备
# extent_size = "4MiB"
meta_dir = "/var/lib/fasts3/meta"
sync_mode = "group"                      # group | full | none
group_commit_ms = 2
checkpoint_interval = 30
# ETag 模式(M5 etag=fast 降级开关):md5(默认,严格 S3 兼容) | crc32c(返回
# CRC32C 串,省去单流 MD5,高吞吐场景;代价 = ETag 非严格 MD5)
# etag_mode = "md5"
# 内联小对象阈值(默认 32KiB;对象 ≤ 此值数据直接内联元数据,零设备 I/O)
# small_object_limit = 32768
# 后台惰性压缩(ADR-9;默认 true)。false = 不启动压缩 worker(前台 compact 仍可用);
# 协议一致性 gate 等需确定性读环境的场景使用(tests/s3-tests/README.md「运行」节)
# compaction_enabled = true
# 生命周期执行器(M11;默认 true)。周期扫描有生命周期规则的桶执行过期删除/
# 会话中止;无规则桶零动作(现状不变)
# lifecycle_enabled = true
# 生命周期执行周期秒数(默认 86400 = 24h,ADR-12 DL3 全量扫描;小周期供测试/演练)
# lifecycle_interval_secs = 86400
# 执行器指标(M11 L3-2):worker 启用时 /v1/admin/metrics 渲染
# fasts3_lifecycle_{cycles,deleted_objects,deleted_bytes,aborted_uploads,
# skipped_locked}_total 与 fasts3_lifecycle_last_cycle_timestamp;
# 告警规则见 deploy/grafana/alerts.yml(停滞 > 2 周期 → warning;删除突增 → info)

[server]
listen = "0.0.0.0:9000"
workers = 0
# 全局在途字节上限(整数;16GiB,超限 503 SlowDown)
max_inflight_bytes = 17179869184
# 请求头读取超时秒数(默认 30;超时断开连接)
# header_timeout_secs = 30
# keep-alive 空闲超时秒数(默认 60)
# idle_timeout_secs = 60
verify_reads = false
# TLS:证书 + 私钥同时配置即启用 rustls(热加载;未配对则告警并明文启动)
# tls_cert = "/etc/fasts3/tls/cert.pem"
# tls_key = "/etc/fasts3/tls/key.pem"
# 内嵌控制台静态目录(等价 serve --web-root;build 后的 web/console/dist)
# web_root = "/opt/fasts3/console/dist"
# REVIEW §2.4:受控 CORS 允许源(浏览器跨源直传数据面;空/缺省 = 关闭)。
# 实际写操作仍需合法 SigV4 签名;["*"] 仅建议内网。
# cors_allow_origins = ["https://console.example.com"]

[auth]
region = "us-east-1"
# 匿名公共读(仅 GET/HEAD;匿名写恒拒绝,REVIEW §3.5)
allow_anonymous = false
# 访问密钥表(生产建议用 fasts3d init 向导生成并落盘)
# [[auth.keys]]
# access_key = "AKIA...EXAMPLE"
# secret_key = "change-me"

[admin]
listen = "unix:///run/fasts3/admin.sock"
token = "change-me"

[limits]
# 每密钥每秒请求上限(0 = 关闭;超限 503 SlowDown + Retry-After)
key_rps = 0

[audit]
# 审计持久化(M11 L3-1;ADR-12 DL5;默认 true):push 同步落 `s:audit` 环形
# (同步小写,组提交 fsync 口径与全库一致),serve 启动回放重建内存检索面
# (/v1/admin/audit 零变化);false = 纯内存现状(重启即清空)。
# 生命周期删除 who=system:lifecycle 重启后仍可检索。
# persist = true
# 磁盘条数上限(默认 100000;超上限批量截断删最旧;与内存环形容量 4096
# 相互独立——内存环形仍是检索面,持久化是冷备 + 重启连续性)
# max_entries = 100000

[notification]
# M15 N3(ADR-18 D-E1/D-E4):事件通知投递 worker。默认启用;无通知规则
# 桶零动作(与生命周期同口径)。事件入队(N2)与数据同事务,关闭本 worker
# 只停止投递、不阻止入队(队列有界,超上限批量截断;恢复打开后续投)。
# 关闭态 /metrics 无 fasts3_notification_* 指标组(告警按缺席处理)。
# enabled = true
# 投递轮询周期秒(默认 1;下限 0.1)
# poll_secs = 1.0
# 重试上限(默认 16;超限死信留存,环形截断清理)
# max_retries = 16
# 每轮批量上限(默认 64)
# batch = 64
# 队首滞留判定窗口秒(默认 120;触顶且零成功 →
# fasts3_notification_delivery_stalled = 1,告警 FastS3NotificationDeliveryStalled)
# stall_after_secs = 120
# 事件队列上限(默认 100000;超上限 + slack 批量截断删最旧,同审计环形口径)
# max_queued = 100000