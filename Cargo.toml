# FastS3 Rust workspace(数据面 + S3 协议层)
# 模块边界见 docs/DESIGN.md §13;依赖方向:fs3d 装配一切,禁止反向依赖
[workspace]
resolver = "2"
members = [
    "crates/fs3-core",
    "crates/fs3-device",
    "crates/fs3-alloc",
    "crates/fs3-meta",
    "crates/fs3-engine",
    "crates/fs3d",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
fs3-core = { path = "crates/fs3-core" }
fs3-device = { path = "crates/fs3-device" }
fs3-alloc = { path = "crates/fs3-alloc" }
fs3-meta = { path = "crates/fs3-meta" }
fs3-engine = { path = "crates/fs3-engine" }

# —— 依赖最小化原则(ROADMAP §2 / 风险 R9):新增依赖须说明理由 ——
thiserror = "2.0"
libc = "0.2"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
io-uring = "0.7"
md-5 = "0.10"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1.5"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
